name: Build Pages and Bundle

on:
  push:
    tags: v*.*
  # Started on a tag by the "Publish release" workflow.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Build website and bundle
      run: npm run build
    - name: Upload website
      uses: actions/upload-pages-artifact@v4
      with:
        path: output/
    - name: Upload bundle
      uses: actions/upload-artifact@v4
      with:
        name: bundle
        path: output/*.json
  deploy:
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
  release:
    name: Create Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: bundle
        path: output/
    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref_name }}
      run: |
        # A release created in GitHub's web interface already exists:
        # attach the bundles to it instead of creating a new one.
        if gh release view "${tag}" > /dev/null 2>&1; then
          gh release upload "${tag}" output/*.json --clobber
        else
          # The notes are the version's tiddler, without its header.
          notes="tiddlers/Versions/${tag#v}.tid"
          if [ -f "${notes}" ]; then
            sed '1,/^$/d' "${notes}" > notes.md
          else
            echo "TW5-Graph ${tag}" > notes.md
          fi
          gh release create "${tag}" \
            --title="TW5-Graph ${tag}" \
            --notes-file notes.md \
            output/*.json
        fi
